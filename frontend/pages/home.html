<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/style.css">
    <title>Home</title>
    <script src="/frontend/scripts/pomodoro.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>
    <header class="header" id="meu-header">
        <p>🦁</p>
        <button class="botao-logout" onclick="logout()">Sair</button>
    </header>
    <div id="app-section" class="container">
        <div class="form">
            <div class="form-left">
                <div class="pomodoro-card">
                    <div class="pomodoro-tabs">
                        <button class="tab active" onclick="setMode('focus')">Pomodoro</button>
                        <button class="tab" onclick="setMode('short')">Short Break</button>
                        <button class="tab" onclick="setMode('long')">Long Break</button>
                    </div>

                    <div class="pomodoro-timer" id="pomodoro-countdown">25:00</div>

                    <div class="pomodoro-button">
                        <button class="pomodoro-main" onclick="togglePomodoro()">START</button>

                        <button class="pomodoro-reset" onclick="resetPomodoro()">RESET</button>
                    </div>
                </div>
            </div>
            <div class="form-right">
                <div class="form-card">
                    <h2>Adicionar tarefas</h2>
                    <div class="form-tarefas">
                        <input id="todo-title" placeholder="Nova tarefa" class="form-input-todo">
                        <button class="botao" onclick="addTodoSimple()">Adicionar</button>
                    </div>
                </div>
                <div class="todo">
                    <h2>Tarefas</h2>
                    <div class="tasks-container">
                        <ul id="todo-list" class="todo-list"></ul>
                    </div>
                </div>
            </div>
        </div>
        <!-- Modal de confirmação -->
        <div class="modal fade" id="confirmDeleteModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content bg-dark text-white">
                    <div class="modal-header">
                        <h5 class="modal-title">Confirmar conclusão</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        Tem certeza que deseja concluir esta tarefa?
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button id="confirmDeleteBtn" type="button" class="btn btn-danger">Concluir</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Modal Editar -->
        <div class="modal fade" id="editTodoModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content bg-dark text-white">
        
                    <div class="modal-header">
                        <h5 class="modal-title">Editar Tarefa</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
        
                    <div class="modal-body">
                        <input type="text" id="editTodoTitle" class="form-control" placeholder="Novo título">
                    </div>
        
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button id="saveEditBtn" type="button" class="btn btn-primary">Salvar</button>
                    </div>
        
                </div>
            </div>
        </div>


    </div>
    <script src="/frontend/scripts/home.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>


</html>
