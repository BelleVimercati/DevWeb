<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Todo + Pomodoro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>

<body>

    <div class="meu-container">
        <div class="form">
            <div class="form-left">
                <h1 class="form-title">Mate o leão 🦁</h1>
            </div>
            <div class="form-right">
                <div id="login-section" class="form-card">
                    <h2 class="mb-4">Bem vindo de volta!</h2>
                
                    <div class="mb-2">
                        <label class="form-label">Usuário ou email</label>
                        <input class="form-control" id="login" required>
                        <div class="invalid-feedback">Campo obrigatório.</div>
                    </div>
                
                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input class="form-control" id="password" type="password" required>
                        <div class="invalid-feedback">Informe sua senha.</div>
                    </div>
                
                    <button class="btn botao w-100" onclick="login()">Entrar</button>
                
                    <div class="register mt-3">
                        <p>Ainda não tem conta?</p>
                        <button onclick="showRegister()" class="button btn btn-link p-0">Criar uma conta.</button>
                    </div>
                </div>



                <div id="register-section" class="hidden form-card">
                    <h2>Cadastre-se!</h2>
                    <input class="form-input" id="reg-username" placeholder="Usuário"><br>
                    <input class="form-input" id="reg-email" placeholder="Email"><br>
                    <input class="form-input" id="reg-password" placeholder="Senha" type="password"><br>
                    <button class="botao" onclick="register()">Registrar</button>

                    <div class="register">
                        <p>Já tem conta?</p>
                        <button onclick="showLogin()">Voltar ao login</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
